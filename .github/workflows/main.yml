on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
jobs:
  # Build job
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Git repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Cache Python environment
        uses: actions/cache@v6
        id: cache-python
        with:
          path: .venv
          key: .venv-${{ hashFiles('requirements.txt') }}
      - name: Apt-Cache-Action
        uses: Eeems-Org/apt-cache-action@v1.5
        with:
          packages: texlive-base texlive-latex-extra graphviz libgraphviz-dev librsvg2-bin pdf2svg enchant-2
      - name: Build website
        shell: bash
        run: make -j "$(nproc)" prod
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "dist"

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
